<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Password reset demonstration for Welcome to Nigeria Travel Magazine."
    />
    <title>Forgot Password | Welcome to Nigeria Travel Magazine</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="forgot-password">
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-site-header></div>
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">Account access</p>
          <h1 class="page-title">Reset your password</h1>
          <p class="body-lead">Request a reset link for your account.</p>
        </div>
      </section>
      <section class="section wrap" style="padding-top: 42px">
        <div class="auth-wrap">
          <form id="forgot-form" class="auth-card">
            <div class="field">
              <label for="reset-email">Email</label
              ><input
                id="reset-email"
                type="email"
                name="email"
                autocomplete="email"
                required
              />
            </div>
            <button class="button" type="submit">Send reset link</button>
            <div class="form-success" role="status" aria-live="polite"></div>
            <p class="auth-links">
              <a class="text-link" href="signin.html">Back to sign in</a>
            </p>
          </form>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="js/stories.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/search.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>

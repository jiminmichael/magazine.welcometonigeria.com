<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Read community travel stories from this Nigerian state."
    />
    <title>Stories by State | Welcome to Nigeria Travel Magazine</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="state">
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-site-header></div>
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <p class="breadcrumb">
            <a href="states.html">All states</a> / Community stories
          </p>
          <p class="eyebrow">Travel through a local point of view</p>
          <h1 class="page-title" id="state-heading">
            Travel Stories From Nigeria
          </h1>
          <p class="body-lead">
            First-hand experiences shared by travellers who have been here.
          </p>
        </div>
      </section>
      <section class="section wrap" style="padding-top: 42px">
        <div class="toolbar">
          <div class="search-field">
            <input
              id="story-search"
              type="search"
              placeholder="Search stories, places or travellers"
              aria-label="Search this state's stories"
            />
          </div>
          <div class="filter-field">
            <select id="sort-filter" aria-label="Sort stories">
              <option value="newest">Newest</option>
              <option value="popular">Most popular</option>
              <option value="featured">Featured</option>
            </select>
          </div>
        </div>
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div class="story-grid" data-story-grid></div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="js/stories.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/search.js"></script>
    <script src="js/profile.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const state =
          new URLSearchParams(location.search).get("state") || "Nigeria";
        document.getElementById("state-heading").textContent =
          `Travel Stories From ${state}`;
        document.title = `Stories From ${state} | Welcome to Nigeria Travel Magazine`;
      });
    </script>
  </body>
</html>

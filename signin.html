<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sign in to your Welcome to Nigeria Travel Magazine demo account."
    />
    <title>Sign In | Welcome to Nigeria Travel Magazine</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="signin">
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-site-header></div>
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">Good to have you back</p>
          <h1 class="page-title">Sign in</h1>
          <p class="body-lead">Pick up where your travels left off.</p>
        </div>
      </section>
      <section class="section wrap" style="padding-top: 42px">
        <div class="auth-wrap">
          <form id="signin-form" class="auth-card">
            <div class="notice">
              Sign in with your verified contributor email and password to access your stories, drafts, and notebook.
            </div>
            <div class="field" style="margin-top: 20px">
              <label for="signin-email">Email</label
              ><input
                id="signin-email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="field" style="margin-top: 16px">
              <label for="signin-password">Password</label
              ><input
                id="signin-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <label class="checkbox-line" style="margin-top: 16px"
              ><input name="remember" type="checkbox" /><span
                >Remember me on this browser</span
              ></label
            ><button class="button" type="submit">Sign in</button>
            <div class="form-success" role="status" aria-live="polite"></div>
            <p class="auth-links">
              <a class="text-link" href="forgot-password.html"
                >Forgot password?</a
              ><a class="text-link" href="signup.html">Create account</a>
            </p>
          </form>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="js/stories.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/search.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
